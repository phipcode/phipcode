name: Latest blog post workflow

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/blog-post-workflow.yml'
      - 'README.md'

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
      
      - name: Bypass Cloudflare for Github Action
        uses: xiaotianxt/bypass-cloudflare-for-github-action@v2.1.0
        with:
          cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CF_ZONE_ID }}
          cf_api_token: ${{ secrets.CF_API_TOKEN }}
      # =========================
      # Generate Neon Badge Cards
      # =========================
      - name: Generate Neon Blog Cards from RSS Feed
        run: |
          curl -s https://phiptech.com/feed/ > feed.xml

          python3 <<'PYEOF'
          import xml.etree.ElementTree as ET
          import urllib.parse

          # Parse RSS feed
          with open("feed.xml", "r", encoding="utf-8") as f:
              tree = ET.parse(f)

          root = tree.getroot()
          items = root.findall(".//item")[:5]

          cards = ""

          # Neon color palette for badges
          neon_colors = [
              "00FF41",  # Neon green
              "00D9FF",  # Neon cyan
              "FF00FF",  # Neon magenta
              "FFD700",  # Neon gold
              "FF1493"   # Neon pink
          ]

          for idx, item in enumerate(items):
              title = item.find("title").text if item.find("title") is not None else "Blog Post"
              link = item.find("link").text if item.find("link") is not None else "#"

              # URL encode the title and truncate if too long
              safe_title = urllib.parse.quote(title[:50])

              # Cycle through neon colors
              color = neon_colors[idx % len(neon_colors)]

              # Create neon-style badge
              card = f'''
          <p align="center">
            <a href="{link}">
              <img src="https://img.shields.io/badge/{safe_title}-Read%20Post-{color}?style=for-the-badge&logo=ghost&logoColor=000000"/>
            </a>
          </p>
          '''
              cards += card

          # Update README
          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          start_tag = "<!-- BLOG-CARDS:START -->"
          end_tag = "<!-- BLOG-CARDS:END -->"

          start = readme.find(start_tag)
          end = readme.find(end_tag)

          if start == -1 or end == -1:
              print("Error: Could not find BLOG-CARDS tags in README.md")
              exit(1)

          start += len(start_tag)
          new_readme = readme[:start] + "\n" + cards + "\n" + readme[end:]

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)

          print(f"Successfully updated README with {len(items)} blog posts")
          PYEOF

      # =========================
      # Commit Changes
      # =========================
      - name: Commit README updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            echo "Changes detected in README.md"

            # Only commit and push on scheduled runs or manual dispatch
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "Running on PR - validation only, skipping commit/push"
              echo "✓ Workflow validation successful"
            else
              git add README.md
              git commit -m "Update blog cards with latest posts"
              git push
              echo "Successfully committed and pushed changes"
            fi
          fi
