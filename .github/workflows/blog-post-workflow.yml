name: Latest blog post workflow

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # =========================
      # STEP 1: Blog Post List
      # =========================
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://phiptech.com/feed/"

      # =========================
      # STEP 2: Generate Cards
      # =========================
      - name: Generate Blog Cards from RSS
        run: |
          curl -s https://phiptech.com/feed/ > feed.xml

          python3 << 'EOF'
import xml.etree.ElementTree as ET

with open("feed.xml", "r", encoding="utf-8") as f:
    tree = ET.parse(f)

root = tree.getroot()
items = root.findall(".//item")[:5]

cards = ""

for item in items:
    title = item.find("title").text
    link = item.find("link").text

    safe_title = title.replace(" ", "%20")

    card = f"""
<p align="center">
  <a href="{link}">
    <img src="https://img.shields.io/badge/{safe_title}-Read%20Post-0D1117?style=for-the-badge&logo=ghost&logoColor=white"/>
  </a>
</p>
"""
    cards += card

with open("README.md", "r", encoding="utf-8") as f:
    readme = f.read()

start_tag = "<!-- BLOG-CARDS:START -->"
end_tag = "<!-- BLOG-CARDS:END -->"

start = readme.find(start_tag) + len(start_tag)
end = readme.find(end_tag)

new_readme = readme[:start] + "\n" + cards + "\n" + readme[end:]

with open("README.md", "w", encoding="utf-8") as f:
    f.write(new_readme)
EOF

      # =========================
      # STEP 3: Commit changes
      # =========================
      - name: Commit README updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md
          git commit -m "Update blog cards" || echo "No changes"
          git push
